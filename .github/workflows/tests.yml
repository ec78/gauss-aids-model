name: Test suite

# Milestone 14: runs on a self-hosted runner (this repo's tests require
# GAUSS/tgauss.exe, a licensed product only installed on the maintainer's
# machine -- GitHub-hosted runners cannot run them).
#
# Deliberately triggers on push only, NOT pull_request: this repository is
# public, and self-hosted runners on public repos are a real security risk
# on pull_request triggers (a fork could open a PR that runs arbitrary
# workflow code on the runner machine). Push access is restricted to repo
# collaborators, so push-only closes that attack vector entirely.
#
# Runs tests/run_source_tests.ps1 only (the fast, read-only source-tree
# suite) -- not the full release-verification/rebuild-and-reinstall
# pipeline, which mutates the shared GAUSS package install
# (c:\gauss26\pkgs\quaids) and stays a manually-run command for now.
#
# Passes -SkipBootstrap: quaids_curvature_bootstrap_test.e (Milestone 15)
# adds roughly 45-50s to this script's runtime (refitting the whole
# estimation pipeline B times per model), close to doubling the routine
# push-triggered run. It stays available for manual/release-verification
# runs (run_source_tests.ps1 without this flag) but opted out of the
# automatic per-push run to keep CI fast.

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, Windows, gauss]
    steps:
      - uses: actions/checkout@v4
      - name: Run source-tree test suite
        # shell: cmd (not the default "powershell", which wraps this
        # whole run: block in its own ". 'tempfile.ps1'" invocation --
        # that OUTER powershell call has no -ExecutionPolicy Bypass of
        # its own, so it hits the policy wall before our inner command
        # ever runs. cmd has no such policy, so our own explicit
        # `powershell -ExecutionPolicy Bypass` below is the first and
        # only PowerShell invocation, and it applies correctly. The
        # runner service runs as NT AUTHORITY\NETWORK SERVICE, a
        # different account from the maintainer's own, whose default
        # execution policy blocks running any .ps1 file at all.
        shell: cmd
        run: powershell -ExecutionPolicy Bypass -File tests\run_source_tests.ps1 -SkipBootstrap
